  <path d="M74 52l5-4.5 5 4.5-5 4.5z" fill="#FFFFFF"/>
  <circle cx="98" cy="52" r="10" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-width="3"/>

